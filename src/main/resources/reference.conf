app {
    # Communities that moved to another zone (e.g. the pilot): inbound Ponton messages whose
    # ReceiverId is listed here are forwarded unchanged to that zone's adapter instead of being
    # processed here (its Ponton agreements stay on this adapter). Key = RC number, value = URL of the target
    # adapter's /pontonxp/message. Empty = every message is processed here (default).
    # forward {
    #   CC100153 = "http://eegfaktura-xp-adapter-service.eegfaktura-pilot.svc.cluster.local:6090/pontonxp/message"
    # }
    forward {}
    # Deadlines while app.forward has entries: the whole request body must arrive within
    # forward-read-timeout (every message, forwarded or not), the target must answer within
    # forward-timeout. Together they should stay below pekko.http.server.request-timeout (20 s),
    # otherwise the server's own 503 answers first; raise that too when raising these. Always with a
    # unit (15s): a bare number is milliseconds; below 1s stops the start.
    forward-read-timeout = 8s
    forward-read-timeout = ${?FORWARD_READ_TIMEOUT}
    forward-timeout = 10s
    forward-timeout = ${?FORWARD_TIMEOUT}
    # Largest request body accepted on /pontonxp/* and /admin/upload (read completely into memory and
    # parsed as one XML document). Larger requests get 413 and a WARN line with the declared size.
    # 128m covers about 3 years of 15-minute energy data for one metering point with 3 measured
    # quantities, even base64-wrapped. Inbound Ponton messages above 16 MiB are logged at INFO with
    # their size (search key ponton-message-size). Always with a unit (256m); a bare number is bytes.
    max-body-size = 128m
    max-body-size = ${?MAX_BODY_SIZE}
    # Largest request accepted on the gRPC port (SendMail from the backend, Ponton admin service). Mails of
    # EEG-editable member texts carry inline images and a PDF (up to 6 MB of files,
    # konzept-mail-texte-editierbar). Only this binding; all other routes keep the pekko-http default (8m).
    grpc-max-content-length = 16m
    grpc-max-content-length = ${?GRPC_MAX_CONTENT_LENGTH}
    # Lowest value of the outgoing message counter (Ponton header id MSG<counter>@<RC>, without a time
    # stamp). The counter is per adapter and starts at 0; an adapter of a second zone (pilot) sets a
    # floor far above the prod counter, so a community that moved there never repeats an id prod
    # already sent. 0 = unchanged (prod). At most 9000000000 (10 digits); the start log shows the value.
    message-seq-floor = 0
    message-seq-floor = ${?MESSAGE_SEQ_FLOOR}
}


epmsmail {
    mail {
        inbox = "./inbox"
        edanet.at {
            interval = 3 minutes
            javaxmail {
                mail {
                    store.protocol = "imap"
                    imap {
                        starttls.enable = true
                    }
                    smtp {
                        starttls.enable = true
                        auth = true
                    }
                }
            }
        }
        gmail.com {
            docMode = "SIMU"
            interval = 3 minutes
            javaxmail {
                mail {
#                     debug = true
                    store.protocol = "imap"
                    imap {
                        ssl.enable = true
                        host = "imap.gmail.com"
                        starttls.enable = true
                    }
                    smtp {
                        host = "smtp.gmail.com"
                        starttls.enable = true
                        auth = true
                    }
                }
            }
        }
        test {
           enable = false
           receiver = "sepp.gaug"
        }
    }
    mqtt {
        host = "localhost"
        port = 1883
        sub-topic = "eda/request"
        qos = 1
        consumer-id = "xpadapter-client"
        topics {
            energyTopic = "eda/response/energy"
            cmTopic = "eda/response/cm"
            cpTopic = "eda/response/cp"
            errorTopic = "eda/response/error"
        }
    }

    admin {
        from = "no-reply@eegfaktura.at"
        from = ${?EMAIL_ADMIN_FROM}
        javaxmail {
            mail {
                smtp {
                    host = ${?SMTP_ADMIN_SERVER_HOST}
                    port = ${?SMTP_ADMIN_SERVER_PORT}
                    starttls.enable = true
                    auth = true
                    # Milliseconds. Without them a hanging relay blocks a send forever; the backend
                    # gives up after 30 s (gRPC deadline), so a send ends well before that.
                    connectiontimeout = 10000
                    connectiontimeout = ${?SMTP_ADMIN_CONNECTION_TIMEOUT}
                    timeout = 20000
                    timeout = ${?SMTP_ADMIN_TIMEOUT}
                    writetimeout = 20000
                    writetimeout = ${?SMTP_ADMIN_WRITE_TIMEOUT}
                }
            }
        }
        authenticator {
            username = ${?EMAIL_ADMIN_USER}
            password = ${?EMAIL_ADMIN_PWD}
        }
    }
}

slick.pgsql.local {
  dataSourceClass = "slick.jdbc.DatabaseUrlDataSource"
  driver = "slick.driver.PostgresDriver$"
  db {
    driver="org.postgresql.Driver"
    url="jdbc:postgresql://localhost:6432/postgresdb"
    user="postgresuser"
    password="postgresPW"
    queueSize=5000
    connectionTimeout=30000
    maxConnections=8
    minConnections=2
    numThreads=8
  }
}

flyway {
  url = ${slick.pgsql.local.db.url}
  user = ${slick.pgsql.local.db.user}
  password = ${slick.pgsql.local.db.password}
  locations = ["classpath:db/migration"]
}

#logger.scala.slick.jdbc.JdbcBackend.statement=INFO
#logging.level.com.zaxxer.hikari.HikariConfig=INFO
#logging.level.com.zaxxer.hikari=INFO

pekko {
  loglevel = "INFO"
  stdout-loglevel = "INFO"
  logging = "slf4j"
  actor.debug.lifecycle = off
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logger {
    scala.slick = INFO
    scala.slick.jdbc.JdbcBackend.statement=INFO
    com.zaxxer.hikari.HikariConfig=INFO
#    com.zaxxer.hikari=INFO
  }

  persistence.journal.plugin = "pekko.persistence.journal.leveldb"
  persistence.snapshot-store.plugin = "pekko.persistence.snapshot-store.local"

  persistence.journal.leveldb.dir = "storage/prod/journal"
  persistence.snapshot-store.local.dir = "storage/prod/snapshots"

#  pekko.persistence.journal.leveldb.native = false

  # pekko-http 1.x: HTTP/2 flag liegt unter preview, nicht direkt unter server
  http.server.preview.enable-http2 = on

  actor {
    serializers {
      jackson-json = "org.apache.pekko.serialization.jackson.JacksonJsonSerializer"
      jackson-cbor = "org.apache.pekko.serialization.jackson.JacksonCborSerializer"
      proto = "org.apache.pekko.remote.serialization.ProtobufSerializer"
    }
    serialization-bindings {
      "at.energydash.actors.CborSerializable" = jackson-cbor
      "at.energydash.domain.EbMsMessage" = jackson-cbor
    }
  }
}
