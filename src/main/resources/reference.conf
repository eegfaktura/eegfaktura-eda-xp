
epmsmail {
    mail {
        inbox = "./inbox"
        edanet.at {
            interval = 3 minutes
            javaxmail {
                mail {
                    store.protocol = "imap"
                    imap {
                        starttls.enable = true
                    }
                    smtp {
                        starttls.enable = true
                        auth = true
                    }
                }
            }
        }
        gmail.com {
            docMode = "SIMU"
            interval = 3 minutes
            javaxmail {
                mail {
#                     debug = true
                    store.protocol = "imap"
                    imap {
                        ssl.enable = true
                        host = "imap.gmail.com"
                        starttls.enable = true
                    }
                    smtp {
                        host = "smtp.gmail.com"
                        starttls.enable = true
                        auth = true
                    }
                }
            }
        }
        test {
           enable = false
           receiver = "sepp.gaug"
        }
    }
    mqtt {
        host = "localhost"
        port = 1883
        sub-topic = "eda/request"
        qos = 1
        consumer-id = "xpadapter-client"
        topics {
            energyTopic = "eda/response/energy"
            cmTopic = "eda/response/cm"
            cpTopic = "eda/response/cp"
            errorTopic = "eda/response/error"
        }
    }

    admin {
        javaxmail {
            mail {
                smtp {
                    host = ${?SMTP_ADMIN_SERVER_HOST}
                    port = ${?SMTP_ADMIN_SERVER_PORT}
                    starttls.enable = true
                    auth = true
                }
            }
        }
        authenticator {
            username = ${?EMAIL_ADMIN_USER}
            password = ${?EMAIL_ADMIN_PWD}
        }
    }
}

slick.pgsql.local {
  dataSourceClass = "slick.jdbc.DatabaseUrlDataSource"
  driver = "slick.driver.PostgresDriver$"
  db {
    driver="org.postgresql.Driver"
    url="jdbc:postgresql://localhost:6432/postgresdb"
    user="postgresuser"
    password="postgresPW"
    queueSize=5000
    connectionTimeout=30000
    maxConnections=8
    minConnections=2
    numThreads=8
  }
}

flyway {
  url = ${slick.pgsql.local.db.url}
  user = ${slick.pgsql.local.db.user}
  password = ${slick.pgsql.local.db.password}
  locations = ["classpath:db/migration"]
}

#logger.scala.slick.jdbc.JdbcBackend.statement=INFO
#logging.level.com.zaxxer.hikari.HikariConfig=INFO
#logging.level.com.zaxxer.hikari=INFO

pekko {
  loglevel = "INFO"
  stdout-loglevel = "INFO"
  logging = "slf4j"
  actor.debug.lifecycle = off
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logger {
    scala.slick = INFO
    scala.slick.jdbc.JdbcBackend.statement=INFO
    com.zaxxer.hikari.HikariConfig=INFO
#    com.zaxxer.hikari=INFO
  }

  persistence.journal.plugin = "pekko.persistence.journal.leveldb"
  persistence.snapshot-store.plugin = "pekko.persistence.snapshot-store.local"

  persistence.journal.leveldb.dir = "storage/prod/journal"
  persistence.snapshot-store.local.dir = "storage/prod/snapshots"

#  pekko.persistence.journal.leveldb.native = false

  http.server.enable-http2 = on

  actor {
    serializers {
      jackson-json = "org.apache.pekko.serialization.jackson.JacksonJsonSerializer"
      jackson-cbor = "org.apache.pekko.serialization.jackson.JacksonCborSerializer"
      proto = "org.apache.pekko.remote.serialization.ProtobufSerializer"
    }
    serialization-bindings {
      "at.energydash.actors.CborSerializable" = jackson-cbor
      "at.energydash.domain.EbMsMessage" = jackson-cbor
    }
  }
}
