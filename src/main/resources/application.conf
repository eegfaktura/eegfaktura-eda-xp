app {
    interface.mode = "SIMU"
    kepserver {
      url = "http://10.10.10.52:6060/ponton/eda/webservice/outbound"
    }
#    supervise-type = None
    server {
      host = "localhost"
      port = 6090
    }
    grpc {
        port = 9093
        host = "0.0.0.0"
    }
}

epmsmail {
    mail {
        inbox = "./inbox"
        edanet.at {
            interval = 3 minutes
            javaxmail {
                mail {
                    store.protocol = "imap"
                    imap {
                        starttls.enable = true
                    }
                    smtp {
                        starttls.enable = true
                        auth = true
                    }
                }
            }
        }
        gmail.com {
            docMode = "SIMU"
            interval = 3 minutes
            javaxmail {
                mail {
#                     debug = true
                    store.protocol = "imap"
                    imap {
                        ssl.enable = true
                        host = "imap.gmail.com"
                        starttls.enable = true
                    }
                    smtp {
                        host = "smtp.gmail.com"
                        starttls.enable = true
                        auth = true
                    }
                }
            }
        }
        test {
           enable = true
           receiver = "sepp.gaug"
        }
    }

    admin {
        javaxmail {
            mail {
                smtp {
                    host = ${?SMTP_ADMIN_SERVER_HOST}
                    port = ${?SMTP_ADMIN_SERVER_PORT}
                    starttls.enable = true
                    auth = true
                }
            }
        }
        authenticator {
            username = ${?EMAIL_ADMIN_USER}
            password = ${?EMAIL_ADMIN_PWD}
        }
    }
}

slick {
  pgsql {
    local {
      profile = "slick.jdbc.PostgresProfile$"
      db {
        driver="org.postgresql.Driver"
        url="jdbc:postgresql://localhost:6432/postgresdb"
        user="postgresuser"
        password="postgresPW"
        queueSize=5000
        connectionTimeout=30000
        maxConnections=8
        minConnections=2
        numThreads=8
      }
    }
  }
}

