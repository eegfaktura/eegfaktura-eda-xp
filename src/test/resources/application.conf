epmsmail {
    mail {
        email.com {
            interval = 23300
            javaxmail {
                mail {
                    transport.protocol.rfc822 = "mocked"
                    ssl.enable = false
                    store.protocol = "imap"
                    imap {
                        host = "email.com"
                        class = "org.jvnet.mock_javamail.MockStore"
                    }
                    mocked {
                        class = "org.jvnet.mock_javamail.MockTransport"
                    }
                }
            }
        }
    }
    mqtt {
        url = "tcp://localhost:1883"
        topic = "eda/request"
        qos = 1
        consumer-id = "edash-mqtt-client"
        topics {
            energyTopic = "eda/response/energy"
            cmTopic = "eda/response/cm"
            cpTopic = "eda/response/cp"
        }
    }
}

app.interface.mode = "SIMU"

slick.pgsql.local = {
  dataSourceClass = "slick.jdbc.DatabaseUrlDataSource"
#  driver = "slick.driver.H2Driver$"
  driver = "slick.driver.PostgresDriver$"
  db {
#     driver=org.h2.Driver
    driver=org.postgresql.Driver
#    url="jdbc:h2:mem:test1;INIT=CREATE SCHEMA IF NOT EXISTS eda\\;SET SCHEMA eda;"
    url="jdbc:postgresql://localhost:54325/postgres"
    connectionPool = disabled
    keepAliveConnection = true

    user="postgres"
    queueSize=5000
    connectionTimeout=30000
    maxConnections=8
    minConnections=2
    numThreads=8
  }
}

akka.persistence.journal.plugin = "akka.persistence.journal.leveldb"
akka.actor {
  serialization-bindings {
    "at.energydash.actors.CborSerializable" = jackson-cbor
  }
}
