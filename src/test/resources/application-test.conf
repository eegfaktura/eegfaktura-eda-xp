# The only test configuration (build.sbt: -Dconfig.resource=application-test.conf; ScalaTestWithActorTestKit
# loads `application-test` by name). Loopback only — a test never talks to a real KEP endpoint, broker,
# database or mail server. Ports: fake Ponton 16060, HTTP 16090, gRPC 19093, MQTT (moquette) 18831,
# PostgreSQL (embedded) 54325. Files go under ${eda.test.storage} (target/test-storage, set by build.sbt).

eda.test.storage = "target/test-storage"

app {
    interface.mode = "SIMU"
    kepserver {
        url = "http://127.0.0.1:16060/ponton/eda/webservice/outbound"
    }
    server {
        host = "127.0.0.1"
        port = 16090
    }
    grpc {
        host = "127.0.0.1"
        port = 19093
    }
}

epmsmail {
    mail {
        inbox = ${eda.test.storage}"/inbox"
        test {
            enable = false
            receiver = "test.receiver"
        }
        # MAIL-type tenants in tests must use this domain: mock-javamail, nothing leaves the JVM.
        email.com {
            interval = 23300
            javaxmail {
                mail {
                    transport.protocol.rfc822 = "mocked"
                    ssl.enable = false
                    store.protocol = "imap"
                    imap {
                        host = "email.com"
                        class = "org.jvnet.mock_javamail.MockStore"
                    }
                    mocked {
                        class = "org.jvnet.mock_javamail.MockTransport"
                    }
                }
            }
        }
    }
    admin {
        from = "no-reply@email.com"
        javaxmail {
            mail {
                transport.protocol.rfc822 = "mocked"
                smtp {
                    host = "email.com"
                    port = 25
                }
                mocked {
                    class = "org.jvnet.mock_javamail.MockTransport"
                }
            }
        }
        authenticator {
            username = "test"
            password = "test"
        }
    }
    mqtt {
        host = "127.0.0.1"
        port = 18831
        sub-topic = "eda/request"
        qos = 1
        consumer-id = "eda-mqtt-client-test"
        topics {
            energyTopic = "eda/response/energy"
            cmTopic = "eda/response/cm"
            cpTopic = "eda/response/cp"
            errorTopic = "eda/response/error"
        }
    }
}

slick.pgsql.local {
    profile = "slick.jdbc.PostgresProfile$"
    db {
        driver = "org.postgresql.Driver"
        url = "jdbc:postgresql://127.0.0.1:54325/postgres"
        user = "postgres"
        password = "postgres"
        connectionPool = disabled
        keepAliveConnection = true
        queueSize = 5000
        connectionTimeout = 30000
        numThreads = 4
    }
}

# reference.conf is resolved on its own, so its ${slick…} substitutions keep the production values:
# Flyway (MigrationRunner) needs its own three keys here.
flyway {
    url = "jdbc:postgresql://127.0.0.1:54325/postgres"
    user = "postgres"
    password = "postgres"
    locations = ["classpath:db/migration"]
}

pekko {
    loglevel = "WARNING"
    persistence.journal.plugin = "pekko.persistence.journal.leveldb"
    persistence.snapshot-store.plugin = "pekko.persistence.snapshot-store.local"
    persistence.journal.leveldb.dir = ${eda.test.storage}"/journal"
    persistence.snapshot-store.local.dir = ${eda.test.storage}"/snapshots"
    actor {
        serialization-bindings {
            "at.energydash.actors.CborSerializable" = jackson-cbor
        }
    }
    test.single-expect-default = 5 seconds
}
