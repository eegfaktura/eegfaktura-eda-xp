  { code = "ANFORDERUNG_ECOF", refused = true }
  { code = "ANFORDERUNG_ECOF", label = "09.99", refused = true }
  { code = "ANFORDERUNG_ECOF", label = "03.00", refused = true }   # process version, not a schema set version (261008-ca1)
  # EC_PODLIST — official 04.10: schema set 02.10, CPRequest_01p12
  { code = "ANFORDERUNG_ECP", label = "02.00", builder = "CPRequestZPListXMLMessageV0200", xsd = "CPRequest_01p12.xsd", header { type = "ANFORDERUNG_ECP", version = "02.00" } }
  { code = "ANFORDERUNG_ECP", label = "02.10", builder = "CPRequestZPListXMLMessageV0200", xsd = "CPRequest_01p12.xsd", header { type = "ANFORDERUNG_ECP", version = "02.10" } }
  { code = "ANFORDERUNG_ECP", refused = true }
  { code = "ANFORDERUNG_ECP", label = "09.99", refused = true }
  # CR_REQ_PT — official 04.10: schema set 03.00, CPRequest_01p12
  { code = "ANFORDERUNG_PT", label = "03.00", builder = "CPRequestMeteringValueXMLMessage", xsd = "CPRequest_01p12.xsd", header { type = "CR_REQ_PT", version = "03.00" } }
  { code = "ANFORDERUNG_PT", refused = true }
  { code = "ANFORDERUNG_PT", label = "09.99", refused = true }
  # CM_REV_SP — official 04.10: schema set 01.30, CMRevoke_01p10
  { code = "AUFHEBUNG_CCMS", label = "01.02", builder = "CMRevokeRequestV0100", xsd = "CMRevoke_01p00.xsd", header { type = "CM_REV_SP", version = "01.02" } }
  { code = "AUFHEBUNG_CCMS", label = "01.10", builder = "CMRevokeRequestV0110", xsd = "CMRevoke_01p00.xsd", header { type = "CM_REV_SP", version = "01.10" } }
  { code = "AUFHEBUNG_CCMS", label = "01.30", builder = "CMRevokeRequestV0130", xsd = "CMRevoke_01p10.xsd", header { type = "CM_REV_SP", version = "01.30" } }
  { code = "AUFHEBUNG_CCMS", refused = true }
