  { code = "ANFORDERUNG_ECON", refused = true }
  { code = "ANFORDERUNG_ECON", label = "09.99", refused = true }
  { code = "ANFORDERUNG_ECON", label = "03.00", refused = true }   # process version, not a schema set version (261008-ca1)
  # EC_REQ_OFF — official 04.10: schema set 02.30, CMRequest_01p30
