# Protocol catalog — the source of truth of the protocol tests (docs: protocol-changes.md of the private
# workspace; README.md beside this file). One row per outbound (message code, version label) and per inbound
# fixture; the specs register one test per row. Quote every value (HOCON: // starts a comment).
#
# outbound row: code, label (absent = no messageCodeVersion), builder (class getVersion must choose),
#   xsd (schema of the document), header { type, version } (Ponton OutboundDocument header),
#   refused = true (no label, or a label without a case of its own: getVersion must refuse it with the ERROR
#   "Unknown version label …", nothing is sent, the sender gets an error; since 1.0.8 — before, an old schema),
#   expect { failure = true } (any other request that must fail instead of being sent),
#   variant (name suffix for a second row of the same code and label), known-error (id of the defect; the row
#   then states the correct outcome), patch (JSON merged
#   into samples/<code>.json; null removes a field).
# Golden files: golden/out/<code>_<label|none>.xml and .header; rewrite with scripts/dev/test.sh --update-golden.

outbound = [
  # EC_REQ_ONL — official 04.10: schema set 02.40, CMRequest_01p30
  { code = "ANFORDERUNG_ECON", label = "02.00", builder = "CMRequestRegistrationOnlineXMLMessageV0200", xsd = "CMRequest_01p20.xsd", header { type = "ANFORDERUNG_ECON", version = "02.00" } }
  { code = "ANFORDERUNG_ECON", label = "02.10", builder = "CMRequestRegistrationOnlineXMLMessageV0210", xsd = "CMRequest_01p21.xsd", header { type = "ANFORDERUNG_ECON", version = "02.10" } }
  { code = "ANFORDERUNG_ECON", label = "02.30", builder = "CMRequestRegistrationOnlineXMLMessageV0230", xsd = "CMRequest_01p30.xsd", header { type = "ANFORDERUNG_ECON", version = "02.30" } }
