# ebUtilities process schemas in src/main/xsd that eda-xp never parses, with the reason (guard 3, 4).
not-parsed = [
  { ns = "http://www.ebutilities.at/schemata/customerconsent/cmrequest/01p10", reason = "outbound only" }
  { ns = "http://www.ebutilities.at/schemata/customerconsent/cmrequest/01p20", reason = "outbound only" }
  { ns = "http://www.ebutilities.at/schemata/customerconsent/cmrequest/01p21", reason = "outbound only" }
  { ns = "http://www.ebutilities.at/schemata/customerconsent/cmrequest/01p30", reason = "outbound only" }
  { ns = "http://www.ebutilities.at/schemata/customerprocesses/cprequest/01p12", reason = "outbound only (admitted by InboundDocument.xsd, parsed as unknown type)" }
  { ns = "http://www.ebutilities.at/schemata/customerprocesses/cpdocument/01p12", reason = "unused (no builder, no parser)" }
  { ns = "http://www.ebutilities.at/schemata/customerprocesses/gc/gcrequest/01p00", reason = "unused (GCRequestV0100Document has no caller, 261008-ca14)" }
  { ns = "http://www.ebutilities.at/schemata/customerprocesses/gc/gcrequestap/01p00", reason = "unused" }
  { ns = "http://www.ebutilities.at/schemata/customerprocesses/gc/gcresponseap/01p00", reason = "unused (not mapped in build.sbt)" }
]
type-libraries = [ "http://www.ebutilities.at/schemata/customerprocesses/common/types/01p20" ]

# The official interface list (marktprozesse.csv, extracted from the ebUtilities "Marktprozesse" release by the
# workspace script scripts/dev/eda/marktprozesse-extract.py) and the date the code targets (guard 8).
# Ponton header rule (README "Ponton header"): MessageType = the message type of the schema set (the message
# code, e.g. ANFORDERUNG_ECP), MessageVersion = the schema set version (the label). These codes still send the
# process code and the messenger accepts it (why is unexplained); each is pinned to the labels it is accepted
# for, so a new label fails guard 9 until the code switches to the message type with that version change.
header-process-code = [
  { code = "ANFORDERUNG_PT", labels = ["03.00"] }
  { code = "AUFHEBUNG_CCMS", labels = ["01.02", "01.10", "01.30"] }
  { code = "ANFORDERUNG_GN", labels = ["03.12", "none"] }   # the backend never sends GN (261008-ca15)
]

official {
  release = "Marktprozesse 04.10"
  reference-date = "2026-10-05"
  # Official message codes of eda-xp's processes that eda-xp does not handle, with the reason and the error id.
  unsupported = [
    { code = "ANTWORT_GN", reason = "MasterData_01p35: no XSD, no parser", error = "261008-ca15" }
    { code = "ANFORDERUNG_GN", reason = "schema set 03.40 has no builder (03.12 hard-coded); the backend never sends GN", error = "261008-ca15" }
    { code = "ANFORDERUNG_ECC", reason = "EC_PRT_CHANGE: no message type, no builder; dead key in the backend config" }
    { code = "ANTWORT_ECC", reason = "EC_PRT_CHANGE not supported" }
    { code = "ABLEHNUNG_ECC", reason = "EC_PRT_CHANGE not supported" }
    { code = "ABLEHNUNG_CRMSG", reason = "eda-xp never rejects a consumption record" }
    { code = "ABLEHNUNG_GN", reason = "eda-xp never answers a master-data request (the list allows LA as sender)" }
  ]
}
