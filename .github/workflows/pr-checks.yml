# Tests on every pull request: the full suite (test.yml). The suite needs no service containers:
# PostgreSQL (embedded), the MQTT broker and the mail transport are in-process stand-ins.
# Versions fixed, each release older than 7 days (checked 2026-10-09): Temurin 17.0.19+10, sbt from
# project/build.properties. Actions pinned by commit SHA.
# Every job keeps its output as an artifact for 30 days (test-results-<job>),
# for the CI report collector (vfeeg-development/eegfaktura-dev).

name: PR Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: Full test suite
    uses: ./.github/workflows/test.yml
