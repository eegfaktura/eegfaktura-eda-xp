# Tests on every pull request: the full suite (test.yml) and, report-only, TenantProviderSpec,
# which has failing tests on master ("Known errors"). The suite needs no service containers:
# PostgreSQL (embedded), the MQTT broker and the mail transport are in-process stand-ins.
# Versions fixed, each release older than 7 days (checked 2026-10-09): Temurin 17.0.19+10, sbt from
# project/build.properties. Actions pinned by commit SHA.

name: PR Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: Full test suite
    uses: ./.github/workflows/test.yml

  known:
    name: Known errors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # report-only: TenantProviderSpec fails on master, the job shows it without blocking the PR
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17.0.19+10'
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@6158cb0903b8ceeae04f830055f3155e1b6a5ad7 # v1.5.11

      - name: TenantProviderSpec
        run: sbt -batch "testOnly at.energydash.actors.TenantProviderSpec"
